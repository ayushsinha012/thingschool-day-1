env:
  contexts:
    - name: maintainxpert
      urls:
        - "https://maintainxpert-api-day27-dev.politeocean-3efec37e.centralindia.azurecontainerapps.io"
  parameters:
    failOnError: false
    progressToStdout: true
jobs:
  - type: openapi
    parameters:
      apiUrl: "https://maintainxpert-api-day27-dev.politeocean-3efec37e.centralindia.azurecontainerapps.io/openapi/v1.json"
      targetUrl: "https://maintainxpert-api-day27-dev.politeocean-3efec37e.centralindia.azurecontainerapps.io"
      context: maintainxpert
  - type: spider
    parameters:
      context: maintainxpert
      url: "https://maintainxpert-api-day27-dev.politeocean-3efec37e.centralindia.azurecontainerapps.io"
      maxDuration: 1
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: report
    parameters:
      template: risk-confidence-html
      reportDir: /zap/wrk
      reportFile: zap-final-report
      reportTitle: "Day 27 MaintainXpert ZAP baseline (OpenAPI-seeded)"
    risks:
      - low
      - medium
      - high
    confidences:
      - low
      - medium
      - high
      - confirmed
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-final-report
